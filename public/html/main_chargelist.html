{{define "main_chargelist"}}

    
       
<div class="tbl-box">
    <!--for demo wrap-->
    <div class="tbl-header">
      <table cellpadding="0" cellspacing="0" border="0">
        <thead>
          <tr>
            <th>승인번호</th>
            <th>기기ID</th>
            <th>충전시간</th>
            <th>충전량</th>
            <th>결제금액</th>
            <th>결제수단</th>
            <th>카드번호</th>
            <th>결제일시</th>
            <th>충전시작시각</th>
            <th>충전완료시각</th>
          </tr>
        </thead>
      </table>
    </div>
    <div class="tbl-content">
      <table cellpadding="0" cellspacing="0" border="0">
        <tbody>
          {{range .Items}}
          <tr>
            <td>{{.Pay_Num}}</td>
            <td>{{.D_Id}}</td>
            <td>{{.C_Time}}</td>
            <td>{{.C_Amount}}</td>
            <td>{{.C_Pay}}</td>
            <td>{{.Pay_By}}</td>
            <td>{{.C_Num}}</td>
            <td>{{.Pay_Day}}</td>
            <td>{{.C_Time_S}}</td>
            <td>{{.C_Time_E}}</td>
          </tr>
          {{end}}
        </tbody>
      </table>
    </div>
  </div>
    
    

</body>
<link rel="stylesheet" href="css/main_chargelist.css" />
<script src="js/main_chargelist.js" defer></script>

</body>
    
</html>

{{end}}
