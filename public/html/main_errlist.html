{{define "main_errlist"}}

    
    
<div class="tbl-box">
    <!--for demo wrap-->
    <div class="tbl-header">
      <table cellpadding="0" cellspacing="0" border="0">
        <thead>
          <tr>
            <th>기기ID</th>
            <th>장애발생시간</th>
            <th>장애회복시간</th>
            <th>장애원인</th>
          </tr>
        </thead>
      </table>
    </div>
    <div class="tbl-content">
      <table cellpadding="0" cellspacing="0" border="0">
        <tbody>
          {{range .Items}}
          <tr>
            <td>{{.D_Id}}</td>
            <td>{{.O_Time}}</td>
            <td>{{.R_Time}}</td>
            <td>{{.Cause}}</td>
          </tr>
          {{end}}
          
          
        </tbody>
      </table>
    </div>
  </div>
    
    

</body>
<link rel="stylesheet" href="css/main_errlist.css" />
<script src="js/main_errlist.js" defer></script>


</html>

{{end}}
