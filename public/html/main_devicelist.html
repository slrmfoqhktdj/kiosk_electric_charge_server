{{define "main_devicelist"}}

    
    
<div class="tbl-box">


    <div class="devicelist-select-box">
      <form class = "device-slc-text-form" id="device-slc-text-form-id">
        <label for="device-name-select-id">기기이름</label>
        <input type="text" id="device-name-select-id" name="device-name-select">
  
        <label for="device-name-select-id">상태</label>
        <input type="text" id="device-name-state-id" name="device-state-select">
  
        <label for="device-name-select-id">위치</label>
        <input type="text" id="device-name-addr-id" name="device-addr-select">
      </form>
    </div>

    <div class="devicelist-turm"></div>

    <div class="devicelist-btn-box">
      <button class="device-reg-btn" id="device-slc-btn-id">조회</button>
      <button class="device-reg-btn" id="device-reg-btn-id">등록</button>
      <button class="device-reg-btn" id="device-upd-btn-id">수정</button>
    </div>
   




    <dialog id="device-reg-dialog">
      <form  class="justify-between" id="device-reg-dialog-form">
        
          <p>기기이름</p>
          <input type="text" name="device-name"/>
          <p>상태</p>
          <input type="text" name="device-state"/>
          <p>위도</p>
          <input type="text" name="device-latitude"/>
          <p>경도</p>
          <input type="text" name="device-longitude"/>
          <p>주소</p>
          <input type="text" name="device-addr"/>
          <p>소프트웨어 버전</p>
          <input type="text" name="device-sw-v"/>
          <p>충전기모델</p>
          <input type="text" name="device-charger-m"/>
          <p>결제기모델</p>
          <input type="text" name="device-pay-m"/>
          <p>하드웨어모델</p>
          <input type="text" name="device-hw-m"/>
      
      </form>
      <div class="device-reg-dialog-btn-box">
        <button value="cancel" class="modal-btn" id="device-reg-dialog-close-btn">취소</button>
        <button value="confirm" class="modal-btn" id="device-reg-dialog-confirm-btn">확인</button>
      </div>
    </dialog>

    <!--for demo wrap-->
    <div class="tbl-header">
      <table cellpadding="0" cellspacing="0" border="0">
        <thead>
          <tr>
            <th>기기ID</th>
            <th>상태</th>
            <th>위도</th>
            <th>경도</th>
            <th>위치</th>
            <th>소프트웨어버전</th>
            <th>충전기모델</th>
            <th>결제기모델</th>
            <th>보드모델</th>
          </tr>
        </thead>
      </table>
    </div>
    <div class="tbl-content">
      <table cellpadding="0" cellspacing="0" border="0">
        <tbody>
          {{range .Items}}
          <tr>
            <td>{{.Id}}</td>
            <td>{{.State}}</td>
            <td>{{.Latitude}}</td>
            <td>{{.Longitude}}</td>
            <td>{{.Addr}}</td>
            <td>{{.S_Version}}</td>
            <td>{{.H_C_M}}</td>
            <td>{{.H_P_M}}</td>
            <td>{{.H_B_M}}</td>
          </tr>
          {{end}}
          
          
        </tbody>
      </table>
    </div>
  </div>
    
    

</body>
<link rel="stylesheet" href="css/main_devicelist.css" />
<script src="js/main_devicelist.js" defer></script>


</html>

{{end}}
